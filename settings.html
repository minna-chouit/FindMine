<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FindMine · Voice settings</title>
<style>
  :root { --bg:#ffffff; --fg:#0d1b2a; --muted:#4a5a6a; --btn:#1446a0; --btn-fg:#ffffff; --line:#c9d3dd; --soft:#eef3f8; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#05080d; --fg:#f2f5f8; --muted:#a9b6c3; --btn:#5b8cff; --btn-fg:#05080d; --line:#2a3644; --soft:#111a24; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 16px); }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:4px 0 12px; }
  h2 { font-size:1.15rem; margin:20px 0 8px; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .row.two { grid-template-columns:repeat(2,1fr); }
  .row button { min-height:56px; font-size:1.1rem; font-weight:700; border:2px solid var(--line); border-radius:12px;
                background:var(--bg); color:var(--fg); cursor:pointer; }
  .row button[aria-pressed="true"] { background:var(--btn); color:var(--btn-fg); border-color:var(--btn); }
  button:focus-visible { outline:4px solid #ffd400; outline-offset:3px; }
  #voice { color:var(--muted); min-height:1.4em; }
  .scroll { overflow-x:auto; margin-top:8px; }
  table { border-collapse:collapse; width:100%; min-width:720px; font-size:.95rem; }
  th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:start; vertical-align:top; }
  th { position:sticky; top:0; background:var(--soft); }
  td.key { font-family:ui-monospace,Consolas,monospace; font-size:.8rem; color:var(--muted); white-space:nowrap; }
  td[dir="rtl"] { text-align:right; }
  td button { border:0; background:none; color:var(--btn); font-size:1.1rem; cursor:pointer; padding:0 4px; }
  a { color:var(--btn); }
</style>
</head>
<body>
<main>
  <h1>Voice settings</h1>

  <h2>Language</h2>
  <div class="row" id="langs"></div>
  <p id="voice"></p>

  <h2>How much should it talk?</h2>
  <div class="row two">
    <button data-vb="short">Short</button>
    <button data-vb="detailed">Detailed</button>
  </div>

  <h2>All sentences (tap ▶ to listen)</h2>
  <div class="scroll"><table id="table"></table></div>

  <p><a href="./">Camera page</a> · <a href="./find.html">Find my item</a> · <a href="./register.html">Register an item</a></p>
</main>

<script src="prompts.js"></script>
<script>
  const SAMPLE = { item: "keys", clock: 2, n: 1, total: 5, side: "side_front", dist: "dist_mid", items: "keys, wallet" };
  const LANGS = Object.keys(FM.LANG_INFO);

  function refresh() {
    document.querySelectorAll("[data-l]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === FM.lang)));
    document.querySelectorAll("[data-vb]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vb === FM.verbosity)));
    const name = FM.LANG_INFO[FM.lang].name;
    document.getElementById("voice").textContent = FM.hasVoice()
      ? "Voice for " + name + " found on this phone ✓"
      : "No voice for " + name + " on this phone. Install it in Settings → Text-to-speech → Google → Install voice data.";
    buildTable();
  }

  function buildTable() {
    const keys = Object.keys(FM.PROMPTS.en);
    let html = "<tr><th>Key</th>" + LANGS.map((l) => "<th>" + FM.LANG_INFO[l].name + "</th>").join("") + "</tr>";
    for (const k of keys) {
      html += "<tr><td class='key'>" + k + "</td>";
      for (const l of LANGS) {
        const text = FM.t(k, SAMPLE, { lang: l });
        const dir = FM.LANG_INFO[l].dir;
        html += "<td dir='" + dir + "'><button aria-label='Play' data-k='" + k + "' data-pl='" + l + "'>▶</button> " +
                text.replace(/</g, "&lt;") + "</td>";
      }
      html += "</tr>";
    }
    document.getElementById("table").innerHTML = html;
  }

  document.getElementById("langs").innerHTML = LANGS.map((l) =>
    "<button data-l='" + l + "'>" + FM.LANG_INFO[l].name + "</button>").join("");
  document.getElementById("langs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-l]"); if (!b) return;
    FM.setLang(b.dataset.l); refresh(); FM.say("welcome", {}, { interrupt: true });
  });
  document.querySelectorAll("[data-vb]").forEach((b) => b.addEventListener("click", () => {
    FM.setVerbosity(b.dataset.vb); refresh(); FM.say("searching", SAMPLE, { interrupt: true });
  }));
  document.getElementById("table").addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    FM.say(b.dataset.k, SAMPLE, { lang: b.dataset.pl, interrupt: true });
  });

  if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", refresh);
  refresh();
</script>
</body>
</html>
