<text x="40" y="52" class="h">FindMine · architecture</text>
<text x="40" y="80" class="c">All vision at inference time runs in OpenCV 5.0.0 (cv.dnn + classic CV). The LLM is only called at decision points, never per frame.</text>

<!-- Phone -->
<rect x="40" y="120" width="300" height="460" rx="28" fill="#FFDCCB" stroke="#7A5A2E" stroke-width="3"/>
<text x="64" y="160" class="t">📱 Phone (PWA)</text>
<text x="64" y="186" class="c">any browser · installable · no account</text>
<g class="s"><text x="64" y="226">• Camera → 640 px JPEG, ~5 fps</text>
<text x="64" y="256">• Voice: “find my keys”</text><text x="80" y="278" class="c">Web Speech API · EN / FR / AR / Darija</text>
<text x="64" y="314">• Speaks every server action</text>
<text x="64" y="344">• Stereo beeps (pan = direction,</text><text x="80" y="366">speed = distance), vibration</text>
<text x="64" y="402">• Yes / No / Got it buttons</text>
<text x="64" y="432">• Auto-capture registration</text>
<text x="64" y="462">• Torch (Android)</text>
<text x="64" y="498">• Large text, dark mode,</text><text x="80" y="520">screen-reader labels (AAA)</text></g>
