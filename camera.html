<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FindMine</title>
<style>
  :root { --bg:#ffffff; --fg:#0d1b2a; --muted:#4a5a6a; --btn:#1446a0; --btn-fg:#ffffff; --stop:#b3261e; --box:#ffd400; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#05080d; --fg:#f2f5f8; --muted:#a9b6c3; --btn:#5b8cff; --btn-fg:#05080d; --stop:#ff6b60; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 16px); }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:4px 0 10px; }
  #go { width:100%; min-height:72px; font-size:1.4rem; font-weight:700; border:0; border-radius:14px;
        background:var(--btn); color:var(--btn-fg); cursor:pointer; }
  #go.on { background:var(--stop); }
  #go:focus-visible { outline:4px solid var(--box); outline-offset:3px; }
  #status { font-size:1.15rem; min-height:1.6em; margin:12px 0; }
  #stage { position:relative; width:100%; }
  video, canvas { display:block; width:100%; border-radius:10px; }
  canvas { position:absolute; inset:0; height:100%; pointer-events:none; }
  #speed { font-size:1rem; color:var(--muted); margin-top:10px; }
  label { display:flex; gap:10px; align-items:center; margin-top:12px; font-size:1.05rem; }
  input[type=checkbox] { width:24px; height:24px; }
</style>
</head>
<body>
<main>
  <h1>FindMine</h1>
  <button id="go">Start</button>
  <p id="status" role="status" aria-live="polite">Tap Start to turn on the camera.</p>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <p id="speed"></p>
  <label><input type="checkbox" id="voice" checked> Speak object names</label>
</main>

<script>
  // ---- Settings ----
  const SERVER = "wss://54-90-98-230.sslip.io/ws";
  const FPS = 5;              // pictures per second
  const WIDTH = 640;          // picture width sent to the server
  const QUALITY = 0.7;        // JPEG quality
  const BOX_FORMAT = "xyxy";  // change to "xyxy" if boxes look wrong
  const MIN_CONF = 0.4;       // ignore weak detections
  const REPEAT_MS = 4000;     // don't repeat the same word faster than this

  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const ctx = overlay.getContext("2d");
  const go = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const speedEl = document.getElementById("speed");
  const voice = document.getElementById("voice");

  const grab = document.createElement("canvas");
  const gctx = grab.getContext("2d");

  let ws = null, running = false, waiting = false, sentAt = 0, timer = null;
  const times = [];
  const lastSaid = {};

  function setStatus(t) { statusEl.textContent = t; }

  function say(text) {
    if (!voice.checked || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    speechSynthesis.speak(u);
  }

  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream;
      await video.play();
    } catch (e) {
      setStatus("Camera blocked: " + e.message + ". Allow the camera in your browser settings, then tap Start.");
      return;
    }
    running = true;
    go.textContent = "Stop";
    go.classList.add("on");
    say("Camera on");
    connect();
    timer = setInterval(sendFrame, 1000 / FPS);
  }

  function stop() {
    running = false;
    clearInterval(timer);
    if (ws) ws.close();
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    go.textContent = "Start";
    go.classList.remove("on");
    setStatus("Stopped. Tap Start to begin again.");
  }

  function connect() {
    setStatus("Connecting to the server...");
    ws = new WebSocket(SERVER);
    ws.onopen = () => { waiting = false; setStatus("Connected. Point the camera around the room."); };
    ws.onclose = () => {
      if (!running) return;
      setStatus("Server connection lost. Trying again...");
      setTimeout(() => { if (running) connect(); }, 1500);
    };
    ws.onmessage = (e) => {
      waiting = false;
      const ms = performance.now() - sentAt;
      times.push(ms);
      if (times.length > 50) times.shift();
      const data = JSON.parse(e.data);
      if (data.error) { setStatus("Server says: " + data.error); return; }
      draw(data);
      speak(data);
      showSpeed(ms);
    };
  }

  function sendFrame() {
    if (!running || !ws || ws.readyState !== 1 || !video.videoWidth) return;
    if (waiting && performance.now() - sentAt < 3000) return;  // wait for the last answer
    waiting = true;
    const h = Math.round(video.videoHeight * WIDTH / video.videoWidth);
    grab.width = WIDTH; grab.height = h;
    gctx.drawImage(video, 0, 0, WIDTH, h);
    grab.toBlob((blob) => {
      if (!blob || ws.readyState !== 1) { waiting = false; return; }
      sentAt = performance.now();
      ws.send(blob);
    }, "image/jpeg", QUALITY);
  }

  function draw(data) {
    overlay.width = data.w;
    overlay.height = data.h;
    ctx.clearRect(0, 0, data.w, data.h);
    const line = Math.max(3, data.w / 150);
    const size = Math.round(data.w / 22);
    ctx.lineWidth = line;
    ctx.font = "700 " + size + "px system-ui, sans-serif";
    for (const d of data.detections) {
      if (d.conf < MIN_CONF) continue;
      let [x, y, a, b] = d.box;
      let w = a, h = b;
      if (BOX_FORMAT === "xyxy") { w = a - x; h = b - y; }
      ctx.strokeStyle = "#ffd400";
      ctx.strokeRect(x, y, w, h);
      const text = d.label + " " + Math.round(d.conf * 100) + "%";
      const tw = ctx.measureText(text).width + 12;
      const ty = Math.max(0, y - size - 8);
      ctx.fillStyle = "#ffd400";
      ctx.fillRect(x, ty, tw, size + 8);
      ctx.fillStyle = "#000000";
      ctx.fillText(text, x + 6, ty + size);
    }
  }

  function speak(data) {
    if (speechSynthesis.speaking) return;
    const best = data.detections
      .filter(d => d.conf >= MIN_CONF)
      .sort((p, q) => q.conf - p.conf)[0];
    if (!best) return;
    const now = performance.now();
    if (now - (lastSaid[best.label] || 0) < REPEAT_MS) return;
    lastSaid[best.label] = now;
    say(best.label);
  }

  function showSpeed(ms) {
    const sorted = [...times].sort((p, q) => p - q);
    const avg = times.reduce((s, t) => s + t, 0) / times.length;
    const median = sorted[Math.floor(sorted.length / 2)];
    speedEl.textContent = "Round trip: " + Math.round(ms) + " ms · average " + Math.round(avg) +
      " ms · median " + Math.round(median) + " ms (" + times.length + " frames)";
  }

  go.addEventListener("click", () => running ? stop() : start());
</script>
</body>
</html>
