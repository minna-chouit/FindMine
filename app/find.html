<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFDE7A">
<title>FindMine · Ask by voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="js/config.js"></script>
<link rel="stylesheet" href="css/app.css">
<style>
  .typed { display:flex; gap:.6rem; align-items:stretch; }
  .typed input { flex:1; }
  .typed .btn { width:auto; margin:0; min-width:5.5rem; }
</style>
</head>
<body>
<main class="wrap">
  <header class="topbar">
    <a class="back" href="./" aria-label="Home">←</a>
    <h1>Ask by voice</h1>
  </header>

  <div class="grid-3" role="group" aria-label="Language">
    <button class="btn" data-lang="en" aria-pressed="true">English</button>
    <button class="btn" data-lang="fr" aria-pressed="false">Français</button>
    <button class="btn" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
  </div>

  <button id="mic" class="btn btn-xl">🎤 Tap and speak</button>
  <p id="heard" class="status" aria-live="polite"></p>
  <p id="answer" class="said" role="status" aria-live="assertive"></p>

  <label for="typed">Or type it</label>
  <div class="typed">
    <input id="typed" type="text" placeholder="find my keys" autocomplete="off">
    <button id="go" class="btn">Go</button>
  </div>

  <p id="items" class="small">Loading your items…</p>
  <p class="small"><a href="./register.html">Register a new item</a> · <a href="./search.html">Pick from a list</a></p>
</main>
<script>
  const SERVER = FM_SERVER;

  const LANGS = {
    en: { rec: "en-US", tts: "en-US", mic: "🎤 Tap and speak", listening: "Listening…",
          example: "Say: find my keys",
          searching: (n) => "Searching for " + n + ".",
          unknown: "I don’t know that item. Your items are: ",
          none: "You have no registered items yet.",
          heard: "I heard: ", noMic: "Voice isn’t supported here. Type your command below." },
    fr: { rec: "fr-FR", tts: "fr-FR", mic: "🎤 Touchez et parlez", listening: "J’écoute…",
          example: "Dites : trouve mes clés",
          searching: (n) => "Je cherche " + n + ".",
          unknown: "Je ne connais pas cet objet. Vos objets sont : ",
          none: "Vous n’avez encore aucun objet enregistré.",
          heard: "J’ai entendu : ", noMic: "La voix n’est pas disponible ici. Écrivez votre commande." },
    ar: { rec: "ar-DZ", tts: "ar-SA", mic: "🎤 اضغط وتكلم", listening: "أنا أستمع…",
          example: "قل: وين المفاتيح",
          searching: (n) => "أبحث عن " + n + ".",
          unknown: "لا أعرف هذا الشيء. أشياؤك هي: ",
          none: "ليس لديك أشياء مسجلة بعد.",
          heard: "سمعت: ", noMic: "الصوت غير متوفر هنا. اكتب طلبك." },
  };

  // Same object in different languages -> one key. Add more as you register items.
  const SYNONYMS = {
    keys:    ["key", "keys", "cle", "cles", "clef", "clefs", "مفتاح", "مفاتيح", "المفاتيح", "ساروت", "سوارت", "السوارت"],
    wallet:  ["wallet", "purse", "portefeuille", "porte-monnaie", "محفظة", "المحفظة", "بزطام", "البزطام"],
    phone:   ["phone", "telephone", "portable", "mobile", "هاتف", "الهاتف", "تيليفون", "التيليفون", "بورطابل"],
    glasses: ["glasses", "lunettes", "نظارات", "النظارات", "مناظر", "المناظر"],
    remote:  ["remote", "telecommande", "تيليكوموند", "التيليكوموند", "ريموت"],
    bag:     ["bag", "sac", "حقيبة", "الحقيبة", "صاك", "الصاك"],
    watch:   ["watch", "montre", "ساعة", "الساعة", "مونطرا"],
    earbuds: ["earbuds", "earphones", "ecouteurs", "airpods", "سماعات", "السماعات", "كيتمان"],
  };

  // Words that only mean "find / where / my" and carry no item meaning
  const FILLER = new Set(["find","my","where","is","are","the","a","search","for","look","locate","please",
    "trouve","trouver","cherche","chercher","mes","mon","ma","ou","est","sont","les","le","la","l","s","il","te","plait","stp",
    "وين","فين","أين","اين","ابحث","عن","لقيلي","جيبلي","قلب","على","راه","راهم","هو","هي"]);

  let lang = "en";
  let items = [];
  const $ = (id) => document.getElementById(id);

  function norm(s) {
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // remove French accents
            .replace(/[\u064B-\u0652]/g, "")                                  // remove Arabic short vowels
            .replace(/[أإآ]/g, "ا").replace(/[’'.,!?؟،]/g, " ").trim();
  }
  function words(s) { return norm(s).split(/\s+/).filter((w) => w && !FILLER.has(w)); }
  function concepts(ws) {
    const out = new Set(ws);
    for (const [key, list] of Object.entries(SYNONYMS)) {
      const normList = list.map(norm);
      if (ws.some((w) => normList.includes(w))) out.add("#" + key);
    }
    return out;
  }

  function match(text) {
    const said = concepts(words(text));
    let best = null, bestScore = 0;
    for (const it of items) {
      const mine = concepts(words(it.name));
      let score = 0;
      for (const c of mine) if (said.has(c)) score += c.startsWith("#") ? 2 : 1;
      if (score > bestScore) { best = it; bestScore = score; }
    }
    return best;
  }

  function pickVoice(code) {
    const voices = speechSynthesis.getVoices();
    const base = code.slice(0, 2);
    return voices.find((v) => v.lang.replace("_", "-") === code) ||
           voices.find((v) => v.lang.toLowerCase().startsWith(base)) || null;
  }
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

  function say(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang].tts;
    const v = pickVoice(LANGS[lang].tts);
    if (v) u.voice = v;
    else if (lang !== "en") $("heard").textContent += "  (No " + (lang === "ar" ? "Arabic" : "French") + " voice on this phone: install it in Settings → Text-to-speech.)";
    speechSynthesis.speak(u);
  }
  function answer(text) { $("answer").textContent = text; say(text); }

  function handle(text) {
    const L = LANGS[lang];
    $("heard").textContent = L.heard + "“" + text + "”";
    if (!items.length) return answer(L.none);
    const it = match(text);
    if (!it) return answer(L.unknown + items.map((i) => i.name).join(", ") + ".");
    try { localStorage.setItem("findmine-target", JSON.stringify(it)); } catch (e) {}
    answer(L.searching(it.name));
    setTimeout(() => { location.href = "./search.html?item=" + encodeURIComponent(it.item_id); }, 1800);
  }

  async function loadItems() {
    try {
      const r = await fetch(SERVER + "/items?owner=" + encodeURIComponent(FM_OWNER));
      items = await r.json();
      $("items").textContent = items.length
        ? "Your items: " + items.map((i) => i.name).join(", ")
        : "No items yet. Register one first.";
    } catch (e) {
      $("items").textContent = "Couldn’t reach the server. Check it’s running, then reload.";
    }
  }

  // Language buttons
  function setLang(l) {
    lang = l;
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    $("mic").textContent = LANGS[l].mic;
    $("answer").textContent = LANGS[l].example;
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

  // Speech recognition
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  $("mic").addEventListener("click", () => {
    if (!Rec) { answer(LANGS[lang].noMic); $("typed").focus(); return; }
    if (listening) { rec.stop(); return; }
    speechSynthesis.cancel();
    rec = new Rec();
    rec.lang = LANGS[lang].rec;
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.onstart = () => { listening = true; $("mic").classList.add("on"); $("mic").textContent = LANGS[lang].listening; };
    rec.onend = () => { listening = false; $("mic").classList.remove("on"); $("mic").textContent = LANGS[lang].mic; };
    rec.onerror = (e) => {
      if (e.error === "language-not-supported" && rec.lang === "ar-DZ") {
        LANGS.ar.rec = "ar-SA";
        $("heard").textContent = "Algerian Arabic not supported here, switched to standard Arabic. Tap the mic again.";
        return;
      }
      $("heard").textContent = "Mic error: " + e.error;
    };
    rec.onresult = (e) => {
      const alts = Array.from(e.results[0]).map((a) => a.transcript);
      const hit = alts.find((t) => match(t)) || alts[0];
      handle(hit);
    };
    rec.start();
  });

  // Typed fallback
  $("go").addEventListener("click", () => { const t = $("typed").value.trim(); if (t) handle(t); });
  $("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });

  // Follow the language chosen in Settings (Darija -> Arabic here)
  let saved = "en";
  try { saved = localStorage.getItem("findmine-lang") || "en"; } catch (e) {}
  setLang(saved === "dz" ? "ar" : (LANGS[saved] ? saved : "en"));

  // Coming from the home page with a spoken command: find.html?q=find%20my%20keys
  const spoken = new URLSearchParams(location.search).get("q");
  loadItems().then(() => { if (spoken) handle(spoken); });
</script>
</body>
</html>
